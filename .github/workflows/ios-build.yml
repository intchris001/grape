name: iOS Build

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list -project Grape.xcodeproj

      - name: Build (xcodebuild)
        run: |
          xcodebuild \
            -project Grape.xcodeproj \
            -scheme Grape \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
